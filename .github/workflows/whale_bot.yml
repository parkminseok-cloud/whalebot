name: Whale Stock Bot

on:
  schedule:
    - cron: "40 6 * * 1-5"  # KST 15:40 (UTC 06:40), 평일만
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas lxml html5lib

      - name: Send whale stock report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python send_stock.py
